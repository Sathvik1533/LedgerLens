<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- 4 Diagonal Feeder Lines (Strict 45° angles, zero curves) -->
  <line x1="8" y1="12" x2="24" y2="24" stroke="#2563EB" stroke-width="4.5" stroke-linecap="round" />
  <line x1="8" y1="52" x2="24" y2="40" stroke="#0891B2" stroke-width="4.5" stroke-linecap="round" />
  <line x1="44" y1="12" x2="36" y2="20" stroke="#2563EB" stroke-width="4.5" stroke-linecap="round" />
  <line x1="44" y1="52" x2="36" y2="44" stroke="#0891B2" stroke-width="4.5" stroke-linecap="round" />
  <!-- Central Diamond Lens -->
  <polygon points="24,32 32,24 40,32 32,40" fill="#0F172A" stroke="#2563EB" stroke-width="3.5" stroke-linejoin="round" />
  <polygon points="29,32 32,29 35,32 32,35" fill="#38BDF8" />
  <!-- Reconciled Outcome Line -->
  <line x1="40" y1="32" x2="58" y2="32" stroke="#059669" stroke-width="4.5" stroke-linecap="round" />
</svg>
