services:
  - type: web
    name: razorpay-ai-finance-controller
    runtime: python
    buildCommand: "pip install --upgrade pip && pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu && pip install -r backend/requirements.txt"
    startCommand: "(alembic upgrade head || echo 'Alembic warning: continuing startup') && uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: ledgerlens-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: BACKEND_PROVIDER
        value: "Render Cloud Infrastructure"
      - key: PYTHONPATH
        value: .
      - key: DEPLOYMENT_VERSION
        value: "2026.09.05-prod"

databases:
  - name: ledgerlens-db
    databaseName: finance_controller
    user: ledgerlens_user
    plan: free
    ipAllowList: []
