<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <title>LedgerLens Mark</title>
  <desc>Two financial streams converging through a central verification aperture into a reconciled ledger record.</desc>
  <!-- Stream 1: Upper Incoming Feed (Cobalt Blue) -->
  <path d="M 8 20 Q 24 20 32 30" stroke="#1D4ED8" stroke-width="4.5" stroke-linecap="round" />
  <!-- Stream 2: Lower Incoming Feed (Deep Cyan) -->
  <path d="M 8 44 Q 24 44 32 34" stroke="#0284C7" stroke-width="4.5" stroke-linecap="round" />
  <!-- Central Aperture: Dark outline + Blue ring + Solid Core for contrast on any background -->
  <circle cx="32" cy="32" r="10.5" fill="#0F172A" stroke="#2563EB" stroke-width="3" />
  <circle cx="32" cy="32" r="4.5" fill="#38BDF8" />
  <!-- Reconciled Stream: Output (Forest Emerald) -->
  <path d="M 43 32 L 56 32" stroke="#059669" stroke-width="4.5" stroke-linecap="round" />
</svg>
