<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <title>LedgerLens Social Preview</title>
  <desc>LedgerLens Financial Reconciliation Control Room architecture and brand preview</desc>
  <rect width="1200" height="630" fill="#080D1A" />
  
  <!-- Structural Blueprint Grid -->
  <g stroke="#1E293B" stroke-width="1" opacity="0.5">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Logo Mark centered (Diamond Aperture) -->
  <g transform="translate(540, 75) scale(1.9)">
    <line x1="8" y1="12" x2="24" y2="24" stroke="#2563EB" stroke-width="4.5" stroke-linecap="round" />
    <line x1="8" y1="52" x2="24" y2="40" stroke="#0891B2" stroke-width="4.5" stroke-linecap="round" />
    <line x1="44" y1="12" x2="36" y2="20" stroke="#2563EB" stroke-width="4.5" stroke-linecap="round" />
    <line x1="44" y1="52" x2="36" y2="44" stroke="#0891B2" stroke-width="4.5" stroke-linecap="round" />
    <polygon points="24,32 32,24 40,32 32,40" fill="#0F172A" stroke="#2563EB" stroke-width="3.5" stroke-linejoin="round" />
    <polygon points="29,32 32,29 35,32 32,35" fill="#38BDF8" />
    <line x1="40" y1="32" x2="58" y2="32" stroke="#059669" stroke-width="4.5" stroke-linecap="round" />
  </g>

  <!-- Title & Subtitle -->
  <text x="600" y="255" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" text-anchor="middle" letter-spacing="-0.5">LedgerLens</text>
  <text x="600" y="295" fill="#60A5FA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" text-anchor="middle" letter-spacing="0.5">Razorpay AI Finance Controller</text>
  <text x="600" y="335" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Financial Reconciliation Control Room &bull; Multi-Source Accounting &bull; Grounded Policy RAG</text>

  <!-- 3 Flow Architecture Pillars -->
  <g transform="translate(180, 400)">
    <!-- Pillar 1: Ingestion -->
    <rect x="0" y="0" width="240" height="135" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
    <text x="24" y="36" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">1. INGESTION</text>
    <text x="24" y="62" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">4 CSV Source Feeds</text>
    <text x="24" y="84" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Dual Raw + Normalized</text>
    <text x="24" y="106" fill="#64748B" font-family="monospace" font-size="10">Idempotency &bull; PostgreSQL</text>

    <!-- Pillar 2: Matcher -->
    <rect x="300" y="0" width="240" height="135" rx="12" fill="#0F172A" stroke="#3B82F6" stroke-width="1.5" />
    <text x="324" y="36" fill="#60A5FA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">2. DETERMINISTIC ENGINE</text>
    <text x="324" y="62" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">3-Stage Parity Matcher</text>
    <text x="324" y="84" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Scale-2 Decimal Precision</text>
    <text x="324" y="106" fill="#10B981" font-family="monospace" font-size="10">8 Exception Categories</text>

    <!-- Pillar 3: Control Room -->
    <rect x="600" y="0" width="240" height="135" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
    <text x="624" y="36" fill="#A78BFA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">3. OPS CONTROL ROOM</text>
    <text x="624" y="62" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">Human Review &amp; Audit</text>
    <text x="624" y="84" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Optimistic Locking (v1 &rarr; v2)</text>
    <text x="624" y="106" fill="#06B6D4" font-family="monospace" font-size="10">Read-Only RAG Copilot</text>
  </g>
</svg>
