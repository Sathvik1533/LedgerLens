name: CI Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Full Integration, E2E & Evaluation Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Start Isolated PostgreSQL Test Database
        run: |
          docker compose -f docker-compose.test.yml up -d --wait

      - name: Run Full Test Suite (40 Tests)
        env:
          TEST_DATABASE_URL: "postgresql://postgres:testpassword@localhost:5433/finance_controller_test"
          PYTHONPATH: .
        run: |
          pytest -v tests/integration/ tests/e2e/ tests/evaluation/

      - name: Teardown Test Database
        if: always()
        run: |
          docker compose -f docker-compose.test.yml down -v
